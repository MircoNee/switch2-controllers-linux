name: Steam gyro protocol tests

on:
  push:
    branches: [main, steam-input-gyro]
  pull_request:

jobs:
  steam-gyro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_steam_gyro.py
